<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17120f" />
  <title>Dough Re Mi - Bakery & Café</title>
  <meta name="description" content="Dough Re Mi Bakery & Café — Ottawa. Reviews, Instagram, directions, menu, and more in one place." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="growth-card" aria-label="Dough Re Mi business links">
      <div class="hero">
        <div class="hero-glow"></div>

        <img class="logo" src="assets/logo.png" alt="Dough Re Mi Bakery & Café logo" />

        <div class="hero-copy">
          <p class="eyebrow">BAKERY & CAFÉ</p>
          <h1>Dough Re Mi</h1>
          <p class="tagline">Good food. Great vibes.</p>
          <p class="address">📍 876 Montréal Rd Unit 7, Ottawa, ON K1K 4L3</p>
          <div class="stars" aria-label="Five star rating">★★★★★</div>
        </div>
      </div>

      <div class="links" id="links"></div>

      <section class="highlights">
        <div class="section-heading">
          <div>
            <p class="eyebrow">OUR HIGHLIGHTS</p>
            <h2>Fresh from the café</h2>
          </div>
          <a id="instagramSeeMore" class="see-more" target="_blank" rel="noopener noreferrer">See more ↗</a>
        </div>

        <div class="gallery">
          <img src="assets/highlight-1.jpg" alt="Dough Re Mi café highlight" />
          <img src="assets/highlight-2.jpg" alt="Dough Re Mi café highlight" />
          <img src="assets/highlight-3.jpg" alt="Dough Re Mi café highlight" />
          <img src="assets/highlight-4.jpg" alt="Dough Re Mi café highlight" />
          <img src="assets/highlight-5.jpg" alt="Dough Re Mi café highlight" />
          <img src="assets/highlight-6.jpg" alt="Dough Re Mi café highlight" />
          <img src="assets/highlight-7.jpg" alt="Dough Re Mi café highlight" />
          <img src="assets/highlight-8.jpg" alt="Dough Re Mi café highlight" />
        </div>
      </section>

      <footer>
        <p>📍 876 Montréal Rd Unit 7, Ottawa, ON K1K 4L3</p>
        <p>Powered by <strong>Tap & Grow</strong> • Ottawa</p>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
